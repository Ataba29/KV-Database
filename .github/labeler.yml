documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"

build:
  - changed-files:
      - any-glob-to-any-file:
          - "CMakeLists.txt"
          - "**/CMakeLists.txt"
          - "Dockerfile"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/tests/**"
          - "**/*test*.cpp"
